aid: greater-good-health
name: Greater Good Health
description: >-
  Greater Good Health is a Manhattan Beach, California value-based senior healthcare
  organization founded in 2021 that delivers preventive, whole-person primary care to
  older adults through a nurse-practitioner-led model. It operates its own senior primary
  care clinics and an integrated clinical services platform — risk adjustment and annual
  wellness visits, transitions of care, high-risk and chronic condition management, and
  behavioral health — delivered on behalf of health plans, medical groups, ACOs and other
  risk-bearing organizations. Alongside care delivery it runs a nurse practitioner
  community, the Greater Good Institute education portal, and clinical technology and
  analytics tooling for its employed NPs. It is a care delivery organization rather than a
  software vendor: it publishes no public developer program, API, SDK or machine-readable
  API contract of any kind.
